<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Vuurens Design Build</title>
  <meta name="theme-color" content="#f7f4ee">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="Brian P. Vuurens Construction, home">
        <img src="logo.png" alt="Brian P. Vuurens Construction" width="1696" height="656">
      </a>
      <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <nav class="site-nav" id="site-nav">
        <ul>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#services">Services</a></li>
          <li><a href="index.html#gallery">Gallery</a></li>
          <li><a class="btn btn-primary" href="index.html#contact">Contact Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="page-head">
      <span class="eyebrow">Gallery</span>
      <h1 id="gallery-title">Our work</h1>
      <p id="gallery-count"></p>
    </div>
    <nav class="tabs" id="gallery-tabs" aria-label="Gallery categories"></nav>
    <div class="photo-grid" id="photo-grid"></div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lb-spinner" aria-hidden="true"></div>
    <img alt="">
    <div class="lb-bar">
      <span class="lb-count" aria-live="polite"></span>
      <button class="lb-btn lb-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lb-btn lb-next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; 2025-2026 Vuurens Design Build</span>
      <span>A <a href="https://adamseidman.com/" target="_blank" rel="noopener">Seidman</a> and <a href="https://zachkrasne.com/" target="_blank" rel="noopener">Krasne</a> website &middot; <a href="privacy.html">Privacy Policy</a></span>
    </div>
  </footer>

  <script src="images/images-list.js"></script>
  <script src="images/web/sizes.js"></script>
  <script src="site.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
